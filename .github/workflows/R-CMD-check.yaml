on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      # macOS needs TMB and RTMB built from SOURCE, AFTER the dependency step
      # installs its binaries. setup-r strips -fopenmp from Makeconf
      # (remove-openmp-macos), but the CRAN binaries are built WITH it and
      # reference OpenMP symbols they do not themselves link, so TMB.so fails
      # to load with "symbol not found in flat namespace
      # '___kmpc_for_static_fini'" and every vignette dies. Installing CRAN's
      # OpenMP runtime does NOT fix it: the error is an unresolved symbol, not
      # a missing library. The job passed until RTMB 2.0 reached CRAN on
      # 2026-09-17 and the binary set changed under it.
      - name: Rebuild the TMB family from source on macOS
        if: runner.os == 'macOS'
        run: |
          Rscript -e 'install.packages(c("TMB", "RTMB"), type = "source", repos = "https://cloud.r-project.org")'
          Rscript -e 'library(RTMB); print(packageVersion("RTMB"))'
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
