# R CMD check for the spatial extension, extensions/frmtmb.spatial.
#
# The extension is not part of the core tarball (.Rbuildignore excludes
# extensions/), so the core workflows never see it. This job installs the
# core package from the checkout, then checks the extension against that
# build. The path filter includes the core R sources as well as the
# extension's own tree, because the extension registers its fields
# through core's covariance-structure and compat seams and a change to
# either is what would break it.
#
# No extra-repositories here: every dependency of this package (Matrix,
# RTMB, brms, fmesher, rstan) is on CRAN, and the package compiles
# nothing. fmesher serves the spde() examples and tests. brms
# and rstan serve the agreement rows of test-brms-likelihood-car.R,
# which skip unless FRMTMB_BRMS_FIT_TESTS is set, as core's do.
on:
  push:
    branches: [main, master]
    paths:
      - 'extensions/frmtmb.spatial/**'
      - 'R/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/check-frmtmb-spatial.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'extensions/frmtmb.spatial/**'
      - 'R/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/check-frmtmb-spatial.yaml'
  workflow_dispatch:

name: check-frmtmb.spatial

jobs:
  check-frmtmb-spatial:
    # Pinned 2026-10-06: ubuntu-latest becomes Ubuntu 26.04 between
    # 2026-10-19 and 2026-11-19. Move with ubuntu-next.yaml (see there).
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      # The core's own dependencies, resolved from the root DESCRIPTION,
      # so that R CMD INSTALL below has everything it needs.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Install the core package from this checkout
        run: R CMD INSTALL --no-multiarch --with-keep.source .
        shell: bash
      # install.packages() below installs no system library. fmesher
      # imports sf (GDAL, GEOS, PROJ, sqlite) and sf imports units
      # (udunits2); without them test-spde.R skips "{fmesher} cannot be
      # loaded" and the job still passes.
      - name: Install the system libraries fmesher links
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev \
            libproj-dev libsqlite3-dev
        shell: bash
      # The extension's own dependencies, read from its DESCRIPTION and
      # installed directly rather than through pak, which would resolve
      # frmtmb against a repository it is in none of.
      - name: Install the extension's dependencies
        run: |
          d <- read.dcf("extensions/frmtmb.spatial/DESCRIPTION")
          f <- intersect(c("Imports", "Suggests"), colnames(d))
          p <- unlist(strsplit(paste(d[, f], collapse = ","), ","))
          p <- trimws(sub("[(].*", "", p))
          p <- setdiff(p[nzchar(p)], rownames(installed.packages()))
          if (length(p)) install.packages(p)
        shell: Rscript {0}
      # NOT_CRAN is repeated here on purpose: the refusal arm of
      # test-guardrail.R and the brms rows carry skip_on_cran(), and
      # without NOT_CRAN reaching the check subprocess this job would
      # pass while asserting neither.
      - uses: r-lib/actions/check-r-package@v2
        env:
          NOT_CRAN: "true"
        with:
          working-directory: extensions/frmtmb.spatial
          args: 'c("--no-manual")'
          upload-snapshots: true
      # A skip on a broken or missing Suggests package passes R CMD
      # check; fail it here (.github/scripts/skip-gate.sh has why)
      - name: Fail on a skip from a broken or missing Suggests package
        run: bash .github/scripts/skip-gate.sh extensions/frmtmb.spatial/check
        shell: bash
