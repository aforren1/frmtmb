# R CMD check for the survival extension, extensions/frmtmb.survival.
#
# The extension is not part of the core tarball (.Rbuildignore excludes
# extensions/), so the core workflows never see it. This job installs the
# core package from the checkout, then checks the extension against that
# build. The path filter includes the core R sources as well as the
# extension's own tree, because the extension consumes core's family,
# simplex, curve-check and compat seams and a change to any of them is
# what would break it.
#
# No extra-repositories here: every suggested dependency of this package
# (brms, flexsurv, rstpm2, splines2, survival) is on CRAN, and the
# package itself compiles nothing.
#
# flexsurv and rstpm2 are what the Royston-Parmar likelihood and its
# frailty fit are checked against, and splines2 and survival what cox()
# is checked against, so they are installed rather than skipped: a run
# that skipped them would pass while asserting nothing about the
# comparisons this package exists to make.
on:
  push:
    branches: [main, master]
    paths:
      - 'extensions/frmtmb.survival/**'
      - 'R/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/check-frmtmb-survival.yaml'
  pull_request:
    branches: [main, master]
    paths:
      - 'extensions/frmtmb.survival/**'
      - 'R/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/check-frmtmb-survival.yaml'
  workflow_dispatch:

name: check-frmtmb.survival

jobs:
  check-frmtmb-survival:
    # Pinned 2026-10-06: ubuntu-latest becomes Ubuntu 26.04 between
    # 2026-10-19 and 2026-11-19. Move with ubuntu-next.yaml (see there).
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      # The core's own dependencies, resolved from the root DESCRIPTION,
      # so that R CMD INSTALL below has everything it needs.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Install the core package from this checkout
        run: R CMD INSTALL --no-multiarch --with-keep.source .
        shell: bash
      # The extension's own dependencies, read from its DESCRIPTION and
      # installed directly rather than through pak. pak resolves every
      # dependency against a repository, and frmtmb is in no repository:
      # the build wanted here is the one installed from the checkout in
      # the step above, so frmtmb is skipped along with anything else
      # already present.
      - name: Install the extension's dependencies
        run: |
          d <- read.dcf("extensions/frmtmb.survival/DESCRIPTION")
          f <- intersect(c("Imports", "Suggests"), colnames(d))
          p <- unlist(strsplit(paste(d[, f], collapse = ","), ","))
          p <- trimws(sub("[(].*", "", p))
          p <- setdiff(p[nzchar(p)], rownames(installed.packages()))
          if (length(p)) install.packages(p)
        shell: Rscript {0}
      # NOT_CRAN is set at the job level above and is repeated here on
      # purpose: the flexsurv and rstpm2 comparisons and the child
      # processes of test-cox-home.R carry skip_on_cran(), and without
      # NOT_CRAN reaching the check subprocess this job would report a
      # green check that asserts nothing about them.
      - uses: r-lib/actions/check-r-package@v2
        env:
          NOT_CRAN: "true"
        with:
          working-directory: extensions/frmtmb.survival
          args: 'c("--no-manual")'
          upload-snapshots: true
      # A skip on a broken or missing Suggests package passes R CMD
      # check; fail it here (.github/scripts/skip-gate.sh has why)
      - name: Fail on a skip from a broken or missing Suggests package
        run: bash .github/scripts/skip-gate.sh extensions/frmtmb.survival/check
        shell: bash
