# rOpenSci's submission gate, run on every push to main: pkgcheck plus
# the srr statistical-standards checks, in the same container the
# rOpenSci editors use. post-to-issue is off so results live in the
# run summary instead of a bot-maintained issue.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: pkgcheck

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    env:
      # The action's container installs our dependencies with pak, which
      # cannot read Additional_repositories from DESCRIPTION, so RTMBode
      # (r-universe-only Suggests) breaks resolution. The container's
      # entrypoint is a plain Rscript with the workspace as its working
      # directory, so it sources this profile, which sets repos to
      # CRAN plus the kaskr repository; pak forwards the session's
      # repos option. Verified locally: pak resolves RTMBode 1.0 with
      # the profile, fails without it.
      R_PROFILE_USER: .github/pkgcheck.Rprofile
      # Chain-agreement test gates are off here: seeded Stan chains are
      # not platform-deterministic, and this container repeatedly draws
      # chains that fail agreement gates every vetted platform passes
      # (local, single-session, the R-CMD-check runners). Structural
      # sampler tests still run. See helper-reference.R.
      FRMTMB_SAMPLER_GATES: "false"
    steps:
      - uses: ropensci-review-tools/pkgcheck-action@main
        with:
          post-to-issue: false
