# rOpenSci's submission gate, run on every push to main: pkgcheck plus
# the srr statistical-standards checks, in the same container the
# rOpenSci editors use. post-to-issue is off so results live in the
# run summary instead of a bot-maintained issue.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

name: pkgcheck

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    env:
      # The container's entrypoint is a plain Rscript with the workspace
      # as its working directory, so it sources this profile. It carries
      # the sampler-gate setting below, which the container does not
      # always pass through as an environment variable.
      R_PROFILE_USER: .github/pkgcheck.Rprofile
      # Chain-agreement test gates are off here: seeded Stan chains are
      # not platform-deterministic, and this container repeatedly draws
      # chains that fail agreement gates every vetted platform passes
      # (local, single-session, the R-CMD-check runners). Structural
      # sampler tests still run. See helper-reference.R.
      FRMTMB_SAMPLER_GATES: "false"
    steps:
      # pkgcheck scores CI from the LATEST push run of each workflow
      # named like "cmd" or "coverage", and a run still in progress has
      # no conclusion, which it scores as a failure. Started by the same
      # push, it always queried before those two finished and so failed
      # on every commit, green or not. Wait for both on this commit.
      - name: Wait for R-CMD-check and test-coverage on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in R-CMD-check.yaml test-coverage.yaml; do
            for i in $(seq 1 100); do
              s=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" \
                    --commit "$GITHUB_SHA" --event push \
                    --json status --jq '.[0].status // "missing"')
              echo "$wf: $s"
              [ "$s" = "completed" ] && break
              # a workflow that never started for this commit would
              # otherwise hold the job for the whole loop
              if [ "$s" = "missing" ] && [ "$i" -ge 5 ]; then break; fi
              sleep 60
            done
          done
      - uses: ropensci-review-tools/pkgcheck-action@main
        with:
          post-to-issue: false
