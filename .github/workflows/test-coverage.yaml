# Coverage on pushes and PRs. Uploads to Codecov when a CODECOV_TOKEN
# secret exists; without one the job still computes and prints the
# package coverage in the run log, so the number is always available.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    # the suite runs in one covr session here; a wedged run should fail
    # the job, not sit for GitHub's 6-hour default
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Measure coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"),
                                                   winslash = "/"),
                                     "package"))
          print(cov)
          covr::to_cobertura(cov, file = "cobertura.xml")
        shell: Rscript {0}
      - uses: codecov/codecov-action@v4
        if: env.CODECOV_TOKEN != ''
        with:
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
