# Subsite for the learning extension.
#
# The site builds into the core package's docs/ tree, so that one
# GitHub Pages deployment serves the core site and the extension sites
# together. Build it with dev/build-docs.R, not on its own: the links
# between packages resolve only when every package is installed first.
url: https://aforren1.github.io/frmtmb/frmtmb.learn
destination: ../../docs/frmtmb.learn

template:
  bootstrap: 5
  light-switch: true

# Naming any repo URL stops pkgdown from reading the rest off
# DESCRIPTION, so the home URL is repeated here to keep the GitHub icon
# in the navbar. The source URL points inside the extension directory,
# because pkgdown takes the repository root as the package root and this
# package is not at the root.
repo:
  url:
    home: https://github.com/aforren1/frmtmb/
    source: https://github.com/aforren1/frmtmb/blob/main/extensions/frmtmb.learn/

navbar:
  structure:
    left:  [core, reference, articles, news]
    right: [search, github, lightswitch]
  components:
    core:
      text: frmtmb
      href: https://aforren1.github.io/frmtmb/

reference:
- title: Families
  desc: >
    One recursion engine, eight models. Each parameter is an ordinary
    distributional parameter with its own linear predictor, so a
    learning rate takes a condition effect, a smooth term or a
    correlated per-subject random effect the way a mean does. Seven
    turn a value store into a softmax over options; rlddm() turns it
    into the drift rate of a diffusion, so choices and response times
    are one likelihood.
  contents:
  - bandit2arm_delta
  - bandit2arm_dual
  - prl_fictitious
  - bandit4arm2_kalman_filter
  - ts_par7
  - igt_pvl_delta
  - igt_orl
  - rlddm
- title: After the fit
  desc: >
    These families declare no mean on the response scale, so fitted()
    and residuals() refuse: for seven of them because the response is a
    nominal option code, and for rlddm() because the mean of a
    first-passage time belongs to frmtmb.eam. The trajectory is read
    here instead.
  contents:
  - frm_value_trace
  - frm_learn_families
- title: Simulation
  desc: >
    Task designs with the payoff schedule of every option fixed in
    advance, and draws from the generative process.
  contents:
  - frm_task_design
  - frm_task_simulate
- title: Package
  contents:
  - frmtmb.learn-package
